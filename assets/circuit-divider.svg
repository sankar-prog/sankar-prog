<svg width="100%" height="40" viewBox="0 0 1200 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00FF41" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <line x1="0" y1="20" x2="1200" y2="20" stroke="#0a3d1f" stroke-width="2"/>

  <!-- nodes -->
  <circle cx="150" cy="20" r="4" fill="#D4AF37"/>
  <circle cx="450" cy="20" r="4" fill="#D4AF37"/>
  <circle cx="750" cy="20" r="4" fill="#D4AF37"/>
  <circle cx="1050" cy="20" r="4" fill="#D4AF37"/>

  <!-- flowing pulse -->
  <rect y="16" width="80" height="8" fill="url(#lineFade)">
    <animate attributeName="x" values="-100;1200" dur="3.2s" repeatCount="indefinite"/>
  </rect>
  <rect y="16" width="50" height="8" fill="url(#lineFade)" opacity="0.6">
    <animate attributeName="x" values="-300;1200" dur="3.2s" begin="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
