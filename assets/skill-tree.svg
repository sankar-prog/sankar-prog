<svg width="100%" height="420" viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="420" fill="#000000"/>

  <!-- connective paths -->
  <g stroke="#0a3d1f" stroke-width="2" fill="none">
    <path d="M400 60 L400 120"/>
    <path d="M400 120 L220 180"/>
    <path d="M400 120 L400 180"/>
    <path d="M400 120 L580 180"/>
    <path d="M220 180 L140 250"/>
    <path d="M220 180 L280 250"/>
    <path d="M400 180 L400 250"/>
    <path d="M580 180 L520 250"/>
    <path d="M580 180 L660 250"/>
    <path d="M140 250 L140 320"/>
    <path d="M400 250 L400 320"/>
    <path d="M660 250 L660 320" stroke-dasharray="4 4"/>
    <path d="M520 250 L520 320" stroke-dasharray="4 4"/>
  </g>

  <!-- flowing pulses along main trunk -->
  <circle r="4" fill="#00FF41">
    <animateMotion path="M400 60 L400 120 L220 180 L140 250 L140 320" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="4" fill="#D4AF37">
    <animateMotion path="M400 60 L400 120 L400 180 L400 250 L400 320" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ROOT -->
  <g filter="url(#nodeGlow)">
    <circle cx="400" cy="40" r="26" fill="#000" stroke="#D4AF37" stroke-width="2.5"/>
    <text x="400" y="45" text-anchor="middle" font-family="monospace" font-size="10" fill="#D4AF37">ROOT</text>
  </g>

  <!-- Tier 1 -->
  <g filter="url(#nodeGlow)">
    <circle cx="400" cy="120" r="24" fill="#000" stroke="#00FF41" stroke-width="2.5"/>
    <text x="400" y="124" text-anchor="middle" font-family="monospace" font-size="10" fill="#00FF41">python</text>
  </g>

  <!-- Tier 2 -->
  <g filter="url(#nodeGlow)">
    <circle cx="220" cy="180" r="22" fill="#000" stroke="#00FF41" stroke-width="2"/>
    <text x="220" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#00FF41">django</text>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="400" cy="180" r="22" fill="#000" stroke="#00FF41" stroke-width="2"/>
    <text x="400" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#00FF41">sql</text>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="580" cy="180" r="22" fill="#000" stroke="#00FF41" stroke-width="2"/>
    <text x="580" y="184" text-anchor="middle" font-family="monospace" font-size="9" fill="#00FF41">html/css</text>
  </g>

  <!-- Tier 3 -->
  <g filter="url(#nodeGlow)">
    <circle cx="140" cy="250" r="20" fill="#000" stroke="#00FF41" stroke-width="2"/>
    <text x="140" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#00FF41">mysql</text>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="280" cy="250" r="20" fill="#000" stroke="#00FF41" stroke-width="2"/>
    <text x="280" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#00FF41">git</text>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="400" cy="250" r="20" fill="#000" stroke="#00FF41" stroke-width="2"/>
    <text x="400" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#00FF41">js</text>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="520" cy="250" r="20" fill="#000" stroke="#555" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="520" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">rest_api</text>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="660" cy="250" r="20" fill="#000" stroke="#555" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="660" y="254" text-anchor="middle" font-family="monospace" font-size="8" fill="#888">vscode</text>
  </g>

  <!-- Tier 4: locked / in-progress -->
  <g filter="url(#nodeGlow)">
    <circle cx="140" cy="320" r="18" fill="#000" stroke="#555" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="140" y="324" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">🔒</text>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="400" cy="320" r="18" fill="#000" stroke="#D4AF37" stroke-width="2" stroke-dasharray="3 3">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="400" y="324" text-anchor="middle" font-family="monospace" font-size="7" fill="#D4AF37">aws</text>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="520" cy="320" r="18" fill="#000" stroke="#D4AF37" stroke-width="2" stroke-dasharray="3 3">
      <animate attributeName="stroke-opacity" values="1;0.3;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="520" y="324" text-anchor="middle" font-family="monospace" font-size="7" fill="#D4AF37">docker</text>
  </g>
  <g filter="url(#nodeGlow)">
    <circle cx="660" cy="320" r="18" fill="#000" stroke="#555" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="660" y="324" text-anchor="middle" font-family="monospace" font-size="7" fill="#666">🔒</text>
  </g>

  <text x="400" y="380" text-anchor="middle" font-family="monospace" font-size="12" fill="#00FF41" opacity="0.85">
    ● unlocked &nbsp;&nbsp; ◐ in-progress (glowing) &nbsp;&nbsp; 🔒 queued next
  </text>
  <text x="400" y="405" text-anchor="middle" font-family="monospace" font-size="11" fill="#5fffb0" opacity="0.6">
    skill_tree.exe — still climbing
  </text>
</svg>
