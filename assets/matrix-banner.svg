<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#001a0a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" fill="url(#bgFade)"/>

  <!-- Matrix rain columns -->
  <g font-family="monospace" font-size="16" fill="#00ff41" opacity="0.55">
    <text x="10" y="0"><animate attributeName="y" values="-40;300" dur="2.3s" repeatCount="indefinite"/>ｱｳｴｵｶｷｸ01ｱｳ</text>
    <text x="45" y="0"><animate attributeName="y" values="-60;300" dur="3.1s" begin="0.4s" repeatCount="indefinite"/>10ｹｺｻｼｽｾｿ01</text>
    <text x="80" y="0"><animate attributeName="y" values="-30;300" dur="2.7s" begin="0.9s" repeatCount="indefinite"/>ﾀﾁﾂﾃﾄ10101</text>
    <text x="115" y="0"><animate attributeName="y" values="-80;300" dur="3.6s" begin="0.2s" repeatCount="indefinite"/>ﾅﾆﾇﾈﾉ01100</text>
    <text x="150" y="0"><animate attributeName="y" values="-20;300" dur="2.1s" begin="1.1s" repeatCount="indefinite"/>ﾊﾋﾌﾍﾎ11001</text>
    <text x="185" y="0"><animate attributeName="y" values="-50;300" dur="2.9s" begin="0.6s" repeatCount="indefinite"/>ﾏﾐﾑﾒﾓ00110</text>
    <text x="220" y="0"><animate attributeName="y" values="-70;300" dur="3.3s" begin="1.4s" repeatCount="indefinite"/>ﾔﾕﾖ0101100</text>
    <text x="255" y="0"><animate attributeName="y" values="-35;300" dur="2.5s" begin="0.3s" repeatCount="indefinite"/>ﾗﾘﾙﾚﾛ10011</text>
    <text x="950" y="0"><animate attributeName="y" values="-40;300" dur="2.4s" begin="0.5s" repeatCount="indefinite"/>ﾜｦﾝ0110101</text>
    <text x="985" y="0"><animate attributeName="y" values="-55;300" dur="3.0s" begin="1.0s" repeatCount="indefinite"/>0101ｱｳｴｵｶ</text>
    <text x="1020" y="0"><animate attributeName="y" values="-25;300" dur="2.6s" begin="0.7s" repeatCount="indefinite"/>1100ｷｸｹｺｻ</text>
    <text x="1055" y="0"><animate attributeName="y" values="-65;300" dur="3.4s" begin="1.3s" repeatCount="indefinite"/>ｼｽｾｿﾀ01010</text>
    <text x="1090" y="0"><animate attributeName="y" values="-45;300" dur="2.2s" begin="0.1s" repeatCount="indefinite"/>ﾁﾂﾃﾄﾅ10101</text>
    <text x="1125" y="0"><animate attributeName="y" values="-75;300" dur="3.7s" begin="0.8s" repeatCount="indefinite"/>ﾆﾇﾈﾉﾊ01100</text>
    <text x="1160" y="0"><animate attributeName="y" values="-30;300" dur="2.8s" begin="1.2s" repeatCount="indefinite"/>ﾋﾌﾍﾎﾏ11010</text>
  </g>

  <!-- Glitch title: gold base + red/cyan offset ghosts -->
  <text x="600" y="130" font-family="'Courier New', monospace" font-size="58" font-weight="bold"
        text-anchor="middle" fill="#ff2b6b" opacity="0.65">
    SANKAR
    <animate attributeName="x" values="600;603;598;600" dur="2.4s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="130" font-family="'Courier New', monospace" font-size="58" font-weight="bold"
        text-anchor="middle" fill="#38f7ff" opacity="0.65">
    SANKAR
    <animate attributeName="x" values="600;597;602;600" dur="2.7s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="130" font-family="'Courier New', monospace" font-size="58" font-weight="bold"
        text-anchor="middle" fill="#d4af37" filter="url(#glow)">
    SANKAR
  </text>

  <text x="600" y="168" font-family="monospace" font-size="20" text-anchor="middle" fill="#00ff41" filter="url(#glow)">
    &gt; PYTHON_DEVELOPER.exe &#8212; ACCESS GRANTED
  </text>

  <text x="600" y="200" font-family="monospace" font-size="14" text-anchor="middle" fill="#5fffb0" opacity="0.85">
