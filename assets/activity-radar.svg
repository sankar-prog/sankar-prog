<svg width="100%" height="360" viewBox="0 0 500 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="500" height="360" fill="#000000"/>
  <defs>
    <filter id="rGlow">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- background rings (pentagon) -->
  <g stroke="#0a3d1f" fill="none" stroke-width="1">
    <polygon points="250,40 410,150 350,320 150,320 90,150"/>
    <polygon points="250,73 378,159 328,296 172,296 122,159"/>
    <polygon points="250,106 346,168 306,272 194,272 154,168"/>
    <polygon points="250,139 314,177 284,248 216,248 186,177"/>
  </g>

  <!-- axis lines -->
  <g stroke="#0a3d1f" stroke-width="1">
    <line x1="250" y1="200" x2="250" y2="40"/>
    <line x1="250" y1="200" x2="410" y2="150"/>
    <line x1="250" y1="200" x2="350" y2="320"/>
    <line x1="250" y1="200" x2="150" y2="320"/>
    <line x1="250" y1="200" x2="90" y2="150"/>
  </g>

  <!-- data polygon: Backend, Frontend, Database, Tools, Curiosity -->
  <polygon points="250,60 385,155 320,290 180,290 130,160"
           fill="#00FF41" fill-opacity="0.18" stroke="#00FF41" stroke-width="2" filter="url(#rGlow)">
    <animate attributeName="fill-opacity" values="0.18;0.3;0.18" dur="2.5s" repeatCount="indefinite"/>
  </polygon>

  <!-- data points -->
  <circle cx="250" cy="60" r="4" fill="#D4AF37"/>
  <circle cx="385" cy="155" r="4" fill="#D4AF37"/>
  <circle cx="320" cy="290" r="4" fill="#D4AF37"/>
  <circle cx="180" cy="290" r="4" fill="#D4AF37"/>
  <circle cx="130" cy="160" r="4" fill="#D4AF37"/>

  <!-- labels -->
  <text x="250" y="25" text-anchor="middle" font-family="monospace" font-size="13" fill="#00FF41">BACKEND</text>
  <text x="430" y="150" text-anchor="middle" font-family="monospace" font-size="13" fill="#00FF41">FRONTEND</text>
  <text x="360" y="345" text-anchor="middle" font-family="monospace" font-size="13" fill="#00FF41">DATABASE</text>
  <text x="140" y="345" text-anchor="middle" font-family="monospace" font-size="13" fill="#00FF41">TOOLS</text>
  <text x="55" y="150" text-anchor="middle" font-family="monospace" font-size="13" fill="#00FF41">CURIOSITY</text>

  <text x="250" y="200" text-anchor="middle" dy="4" font-family="monospace" font-size="10" fill="#5fffb0" opacity="0.6">core</text>
</svg>
