<svg width="100%" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="140" fill="#000000"/>
  <rect width="900" height="140" fill="none" stroke="#0a3d1f" stroke-width="1"/>

  <text x="20" y="25" font-family="monospace" font-size="13" fill="#D4AF37">◈ COMMIT_PULSE_MONITOR.exe</text>
  <text x="700" y="25" font-family="monospace" font-size="12" fill="#00FF41">STATUS: ACTIVE ●</text>

  <!-- grid -->
  <g stroke="#0a2a15" stroke-width="1">
    <line x1="0" y1="90" x2="900" y2="90"/>
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
  </g>

  <!-- EKG waveform, looping -->
  <path d="M0,90 L60,90 L80,90 L95,40 L110,130 L125,90 L200,90 L260,90
           L280,90 L295,50 L310,120 L325,90 L400,90 L460,90
           L480,90 L495,35 L510,135 L525,90 L600,90 L660,90
           L680,90 L695,45 L710,125 L725,90 L800,90 L900,90"
        fill="none" stroke="#00FF41" stroke-width="2.5">
    <animate attributeName="stroke-dasharray" values="0,2000;2000,0" dur="3s" repeatCount="indefinite"/>
  </path>

  <!-- traveling scan dot -->
  <circle r="5" fill="#D4AF37">
    <animateMotion path="M0,90 L60,90 L80,90 L95,40 L110,130 L125,90 L200,90 L260,90
           L280,90 L295,50 L310,120 L325,90 L400,90 L460,90
           L480,90 L495,35 L510,135 L525,90 L600,90 L660,90
           L680,90 L695,45 L710,125 L725,90 L800,90 L900,90" dur="3s" repeatCount="indefinite"/>
  </circle>

  <text x="20" y="128" font-family="monospace" font-size="11" fill="#5fffb0" opacity="0.7">reading: consistent activity detected across repositories</text>
</svg>
