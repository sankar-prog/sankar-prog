  <rect width="525" height="245" rx="20" fill="url(#card)" stroke="#164626"/>
  <text x="25" y="34" fill="#00ff41" font-size="10" letter-spacing="2">PROJECT_01</text>
  <text x="25" y="72" fill="#effff2" font-size="23" font-weight="700">E-Commerce Website</text>
  <text x="25" y="103" fill="#6f8b76" font-size="11">FRONTEND APPLICATION</text>
  <rect x="25" y="125" width="475" height="1" fill="#17351f"/>
  <text x="25" y="153" fill="#b9cdbd" font-size="12">HTML   ·   CSS   ·   JAVASCRIPT</text>
  <circle class="pulse" cx="30" cy="190" r="4" fill="#00ff41" filter="url(#glow)"/>
  <text x="45" y="194" fill="#7fe994" font-size="11">LIVE</text>
  <text x="25" y="225" fill="#00ff41" font-size="11">↗ DEMO</text>
  <text x="425" y="225" fill="#00ff41" font-size="11" text-anchor="end">⌘ SOURCE</text>
</g>

