  <text x="25" y="225" fill="#00ff41" font-size="11">⌘ SOURCE</text>
</g>

<g transform="translate(55 385)">
  <rect width="525" height="245" rx="20" fill="url(#card)" stroke="#164626"/>
  <text x="25" y="34" fill="#00ff41" font-size="10" letter-spacing="2">PROJECT_03</text>
  <text x="25" y="72" fill="#effff2" font-size="23" font-weight="700">AI Skin Disease Detection</text>
