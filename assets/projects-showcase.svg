<!-- Decorative network -->
<path class="flow" d="M580 235H620M580 510H620" fill="none"/>
<circle class="blink" cx="600" cy="235" r="2.5" fill="#00ff41"/>
<circle class="blink" cx="600" cy="510" r="2.5" fill="#00ff41"/>

