<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#030604"/><stop offset=".55" stop-color="#07100a"/><stop offset="1" stop-color="#020403"/>
  </linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#0b1710"/><stop offset="1" stop-color="#050a07"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#00ff41" stroke-opacity=".045"/>
  </pattern>
  <style>
    text{font-family:"Fira Code","JetBrains Mono",monospace}
    .flow{stroke:#00ff41;stroke-width:1.2;stroke-dasharray:5 13;animation:flow 1.5s linear infinite}
    .scan{animation:scan 4.5s ease-in-out infinite}
    .pulse{animation:pulse 2.5s ease-in-out infinite}
    .blink{animation:blink 1.2s steps(2,end) infinite}
    .bar{animation:bar 2.8s ease-in-out infinite}
    @keyframes flow{to{stroke-dashoffset:-36}}
    @keyframes scan{0%,100%{opacity:.02;transform:translateY(-12px)}50%{opacity:.12;transform:translateY(12px)}}
    @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    @keyframes blink{50%{opacity:.15}}
    @keyframes bar{0%,100%{width:25}50%{width:95}}
  </style>
</defs>

<rect width="1200" height="720" rx="30" fill="url(#bg)" stroke="#15351e"/>
<rect x="1" y="1" width="1198" height="718" rx="29" fill="url(#grid)"/>

<!-- Header -->
<text x="55" y="55" fill="#00ff41" font-size="13" letter-spacing="3">root@sankar:~$ ./projects --showcase</text>
<text x="1145" y="55" text-anchor="end" fill="#55705d" font-size="10" letter-spacing="2">PROJECT_INDEX // 04</text>
<line x1="55" y1="78" x2="1145" y2="78" stroke="#163b21"/>

<!-- Project cards -->
