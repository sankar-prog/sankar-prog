    DIGITAL_WORKSPACE // SANKAR.DEV
  </text>

  <!-- section number -->
  <text x="735" y="54"
        fill="#00FF41"
        font-family="Fira Code, JetBrains Mono, Consolas, monospace"
        font-size="14"
        letter-spacing="2">
