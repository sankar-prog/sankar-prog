<svg width="100%" height="320" viewBox="0 0 600 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- orbit rings -->
  <circle cx="300" cy="160" r="70" fill="none" stroke="#0a3d1f" stroke-width="1.5"/>
  <circle cx="300" cy="160" r="120" fill="none" stroke="#0a3d1f" stroke-width="1.5"/>

  <!-- hub -->
  <circle cx="300" cy="160" r="45" fill="url(#hubGlow)"/>
  <circle cx="300" cy="160" r="30" fill="#000000" stroke="#D4AF37" stroke-width="2"/>
  <text x="300" y="155" text-anchor="middle" font-family="monospace" font-size="11" fill="#D4AF37">CORE</text>
  <text x="300" y="169" text-anchor="middle" font-family="monospace" font-size="9" fill="#00FF41">python</text>

  <!-- inner orbit: 3 nodes rotating -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 300 160" to="360 300 160" dur="14s" repeatCount="indefinite"/>
    <g transform="translate(370,160)">
      <circle r="20" fill="#000000" stroke="#00FF41" stroke-width="2"/>
      <text text-anchor="middle" dy="4" font-family="monospace" font-size="9" fill="#00FF41" transform="rotate(0)">
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="14s" repeatCount="indefinite" additive="sum"/>
        django
      </text>
    </g>
    <g transform="rotate(120 300 160) translate(370,160)">
      <circle r="20" fill="#000000" stroke="#00FF41" stroke-width="2"/>
      <text text-anchor="middle" dy="4" font-family="monospace" font-size="9" fill="#00FF41">html</text>
    </g>
    <g transform="rotate(240 300 160) translate(370,160)">
      <circle r="20" fill="#000000" stroke="#00FF41" stroke-width="2"/>
      <text text-anchor="middle" dy="4" font-family="monospace" font-size="9" fill="#00FF41">css</text>
    </g>
  </g>

  <!-- outer orbit: 5 nodes rotating opposite direction -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 300 160" to="0 300 160" dur="22s" repeatCount="indefinite"/>
    <g transform="translate(420,160)">
      <circle r="18" fill="#000000" stroke="#D4AF37" stroke-width="2"/>
      <text text-anchor="middle" dy="4" font-family="monospace" font-size="8" fill="#D4AF37">git</text>
    </g>
    <g transform="rotate(72 300 160) translate(420,160)">
      <circle r="18" fill="#000000" stroke="#D4AF37" stroke-width="2"/>
      <text text-anchor="middle" dy="4" font-family="monospace" font-size="8" fill="#D4AF37">sql</text>
    </g>
    <g transform="rotate(144 300 160) translate(420,160)">
      <circle r="18" fill="#000000" stroke="#D4AF37" stroke-width="2"/>
      <text text-anchor="middle" dy="4" font-family="monospace" font-size="8" fill="#D4AF37">mysql</text>
    </g>
    <g transform="rotate(216 300 160) translate(420,160)">
      <circle r="18" fill="#000000" stroke="#D4AF37" stroke-width="2"/>
      <text text-anchor="middle" dy="4" font-family="monospace" font-size="8" fill="#D4AF37">aws</text>
    </g>
    <g transform="rotate(288 300 160) translate(420,160)">
      <circle r="18" fill="#000000" stroke="#D4AF37" stroke-width="2"/>
      <text text-anchor="middle" dy="4" font-family="monospace" font-size="8" fill="#D4AF37">docker</text>
    </g>
  </g>

  <text x="300" y="305" text-anchor="middle" font-family="monospace" font-size="11" fill="#5fffb0" opacity="0.7">
    orbiting knowledge, one commit at a time
  </text>
</svg>
