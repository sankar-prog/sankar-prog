<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#00ff41" stroke-opacity=".045"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00ff41"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="220" rx="16" fill="#030603"/>
  <rect x="1" y="1" width="1198" height="218" rx="15" fill="url(#grid)" stroke="#00ff41" stroke-width="2"/>

  <!-- subtle top scan -->
  <rect x="32" y="52" width="1136" height="1.5" fill="url(#scan)" opacity=".8">
    <animate attributeName="x" values="32;180;32" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="width" values="220;700;220" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="38" y="38" fill="#00ff41"
        font-family="'Fira Code', monospace" font-size="12" font-weight="600">
    &gt; workspace.status
  </text>

  <text x="1030" y="38" fill="#5dff77"
        font-family="'Fira Code', monospace" font-size="11">
    PRIVATE_BUILD
  </text>

  <!-- title -->
  <text x="46" y="94" fill="#00ff41"
        font-family="'Fira Code', monospace" font-size="30" font-weight="700"
        filter="url(#glow)">
    CURRENTLY_BUILDING
    <animate attributeName="opacity" values="1;.82;1" dur="2.8s" repeatCount="indefinite"/>
  </text>

  <text x="46" y="119" fill="#8aff9b"
        font-family="'Fira Code', monospace" font-size="12">
    [ status ] &gt; actively developing something new...
  </text>

  <!-- private build card -->
  <rect x="46" y="140" width="1108" height="48" rx="8"
        fill="#061006" stroke="#00ff41" stroke-opacity=".48"/>

  <circle cx="70" cy="164" r="5" fill="#00ff41" filter="url(#glow)">
    <animate attributeName="opacity" values="1;.25;1" dur="1.3s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;7;5" dur="1.3s" repeatCount="indefinite"/>
  </circle>

  <text x="88" y="169" fill="#d8ffe0"
        font-family="'Fira Code', monospace" font-size="14">
    BUILD_IN_PROGRESS
  </text>

  <text x="385" y="169" fill="#5dff77"
        font-family="'Fira Code', monospace" font-size="13">
    details intentionally hidden
  </text>

  <!-- terminal cursor -->
  <rect x="1089" y="157" width="7" height="14" fill="#00ff41">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- animated bottom scanline -->
  <path d="M46 201H1154" stroke="#00ff41" stroke-opacity=".20"/>
  <rect x="46" y="200" width="150" height="2" fill="url(#scan)">
    <animate attributeName="x" values="46;1004;46" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="46" y="212" fill="#00ff41"
        font-family="'Fira Code', monospace" font-size="9">
    $ code • test • refine
  </text>

  <text x="1050" y="212" fill="#00ff41"
        font-family="'Fira Code', monospace" font-size="9">
    BUILD_MODE
  </text>
</svg>